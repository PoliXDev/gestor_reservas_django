databases:
  - name: gestor-reservas-db
    plan: free

services:
  - type: web
    name: gestor-reservas-api
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gestor-reservas-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://gestor-reservas-api.onrender.com,https://gestor-reservas-web.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://gestor-reservas-web.onrender.com"
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: RUN_SEED
        value: "true"

  - type: web
    name: gestor-reservas-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: VITE_API_URL
        value: https://gestor-reservas-api.onrender.com
